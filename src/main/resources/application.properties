spring.application.name=chatbot

# Render provides PORT; local development falls back to 8080.
server.port=${PORT:8080}

# Gemini API key is provided through the GEMINI_API_KEY environment variable.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}

# Expose only health and aggregate metrics; never expose environment/configuration endpoints.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
